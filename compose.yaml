services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      DB_PATH: /app/data/bot.sqlite3
      KITTEN_DIR: /app/assets/kittens
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
