name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build and check Compose with persistent storage
        env:
          BOT_TOKEN: "123456:ci-placeholder"
        run: |
          docker compose config --quiet
          docker compose build
          docker compose run --rm --no-deps bot python -c '
          import hashlib
          import json
          import os
          from dataclasses import asdict
          from kitten_bot.cat_sync import CatFile, validate_image
          from kitten_bot.config import Config
          from kitten_bot.photos import Photos
          from kitten_bot.storage import Store
          config = Config.from_env()
          assert os.getuid() == 10001
          assert len(Photos(config.kitten_dir).files) >= 2
          store = Store(config.db_path)
          assert store.settings(-1).window == 40
          store.configure(-1, count=7)
          store.close()
          photo = Photos(config.kitten_dir).files[0]
          data = photo.read_bytes()
          sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          entry = CatFile(photo.name, sha, len(data))
          validate_image(data, entry)
          cache = config.db_path.parent / "cats"
          (cache / "objects").mkdir(parents=True, exist_ok=True)
          (cache / "objects" / entry.cache_name).write_bytes(data)
          (cache / "current.json").write_text(json.dumps({"commit": "a" * 40, "files": [asdict(entry)]}))
          '
          docker compose run --rm --no-deps bot python -c '
          from kitten_bot.config import Config
          from kitten_bot.photos import Photos
          from kitten_bot.storage import Store
          config = Config.from_env()
          store = Store(config.db_path)
          assert store.settings(-1).count == 7
          store.close()
          photos = Photos(config.kitten_dir, cache_dir=config.db_path.parent / "cats")
          assert len(photos.files) == 1
          assert photos.commit == "a" * 40
          '
          docker compose run --rm --no-deps -e TELEGRAM_PROXY_URL=socks5://proxy.example:1080 bot python -c '
          import asyncio
          from kitten_bot.config import Config
          from kitten_bot.network import ReliableBot
          async def check():
              config = Config.from_env()
              assert config.telegram_proxy_url == "socks5://proxy.example:1080"
              bot = ReliableBot(config.token, proxy_url=config.telegram_proxy_url)
              for request in bot._request:
                  await request.shutdown()
          asyncio.run(check())
          '
